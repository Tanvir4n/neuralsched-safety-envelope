services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: neuralsched
      POSTGRES_PASSWORD: neuralsched
      POSTGRES_DB: neuralsched
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuralsched"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://neuralsched:neuralsched@db:5432/neuralsched
      JWT_SECRET: neuralsched-dev-secret-change-me
      TELEMETRY_TICK_SECONDS: "10"
      NUM_GPU_NODES: "8"
      ELECTRICITY_MAPS_TOKEN: ""
      ELECTRICITY_MAPS_ZONE: "DE"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
