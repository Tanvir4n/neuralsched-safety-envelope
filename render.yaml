# Render free-tier backend deployment for NeuralSched.
# Docs: https://render.com/docs/blueprint-spec  (verify current free-tier limits)
#
# Notes:
# - Free web services sleep after 15 min idle (~30-60s cold start). Add a
#   keep-alive ping to /healthz before a live demo.
# - Set secrets (JWT_SECRET, DATABASE_URL, HF_MODEL_REPO) in the Render dashboard.
services:
  - type: web
    name: neuralsched-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: JWT_SECRET
        sync: false            # set in dashboard
      - key: DATABASE_URL
        sync: false            # Supabase connection string
      - key: TELEMETRY_TICK_SECONDS
        value: "10"
      - key: NUM_GPU_NODES
        value: "32"
      - key: ELECTRICITY_MAPS_TOKEN
        sync: false            # optional
      - key: ELECTRICITY_MAPS_ZONE
        value: "DE"
      - key: HF_MODEL_REPO
        sync: false            # e.g. your-user/neuralsched-weights (optional)
